<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המנוע שמתחת לרגלינו – הדמיות תהליכים גיאולוגיים</title>
<style>
  :root{
    --ink:#1f2a33; --muted:#5d6b75; --line:#dfe5e8; --bg:#f4f6f5; --card:#ffffff;
    --accent:#1f5f6b; --accent-soft:#e3eff0; --gold:#c9902c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Rubik","Segoe UI",Arial,sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 30px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .kicker{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
  h1{margin:4px 0 0;font-size:30px;line-height:1.15}
  .sub{color:var(--muted);font-size:15px;margin-top:6px}
  .modes{display:flex;gap:8px;flex-wrap:wrap}
  .modes button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;transition:.15s}
  .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel h2{font-size:21px;margin:4px 0 8px;line-height:1.25}
  .panel p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
  .tag{font-size:12px;font-weight:700;color:var(--accent)}
  .sep{height:1px;background:var(--line);margin:16px 0}
  .stepno{font-size:12px;color:var(--accent);font-weight:700}
  .note{font-size:12px;color:#7b8790;line-height:1.5}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .canvasbox{position:relative;background:#03060c}
  canvas{display:block;width:100%;height:auto}
  .chip{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);opacity:0;transition:opacity .4s}
  .chip.show{opacity:1}
  .tools{position:absolute;top:12px;right:12px;display:flex;gap:6px}
  .tools button{border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  .tools button.on{background:var(--accent-soft);border-color:#b9d5d8}
  .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-left:5px}
  .litho{display:inline-flex;align-items:center;gap:8px;border:1px dashed #b8c3c8;border-radius:8px;padding:3px 8px}
  .controls{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
  .play{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;min-width:96px}
  .icon{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}
  .track{flex:1;position:relative;padding-top:4px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .marks{position:relative;height:18px;font-size:11px;color:#7b8790}
  .marks span{position:absolute;transform:translateX(50%);white-space:nowrap;width:18px;height:18px;border-radius:50%;background:#e3eff0;color:var(--accent);font-weight:700;text-align:center;line-height:18px}
  select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px}
  .steps{display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:1px solid var(--line)}
  .steps button{border:0;background:#fff;padding:11px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
  .steps button.on{color:var(--accent);font-weight:700;border-top-color:var(--accent);background:#f7fbfb}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  .tabs button{text-align:right;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);transition:.15s}
  .tabs button b{display:block;font-size:16px}.tabs button small{color:var(--muted);font-size:12.5px}
  .tabs button .n{float:left;color:#9aa6ad;font-weight:700;font-size:14px}
  .tabs button.on{background:var(--accent-soft);border-color:#9fc7cb;box-shadow:inset 0 -3px 0 var(--accent)}
  .agebar{display:none;margin-top:12px}.agebar .g{height:10px;border-radius:6px;background:linear-gradient(90deg,#4b3f8f,#9b4fa8,#d9534f,#f6a23c,#ffe27a)}
  .agebar .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .hidden{display:none!important}
  footer{margin-top:12px;font-size:12px;color:#8a959c;display:flex;justify-content:space-between}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs">
    <button data-sim="divergence"><span class="n">01</span><b>פתיחה והתרחקות</b><small>קרקעית חדשה נוצרת</small></button>
    <button data-sim="convergence"><span class="n">02</span><b>הפחתה והתקרבות</b><small>שלושה סוגי מפגש</small></button>
    <button data-sim="transform"><span class="n">03</span><b>תנועת החלקה</b><small>לוחות נעים זה לצד זה</small></button>
    <button data-sim="tsunami"><span class="n">04</span><b>צונאמי</b><small>מקרקעית הים אל החוף</small></button>
  </nav>
  <header>
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="h1"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="modes" id="modes">
      <button data-m="oc" class="on">אוקיינית ויבשתית</button>
      <button data-m="oo">אוקיינית ואוקיינית</button>
      <button data-m="cc">יבשתית ויבשתית</button>
    </div>
  </header>

  <div class="grid">
    <aside class="panel">
      <div class="tag">לפני שמפעילים</div>
      <h2 id="preq"></h2>
      <p id="pret"></p>
      <div class="agebar" id="agebar"><div class="g"></div><div class="l"><span>צעיר</span><span>ותיק</span></div><div class="note" style="margin-top:4px">הצבעים מסמנים גיל במודל בלבד, לא את צבע הסלע.</div></div>
      <div class="sep"></div>
      <div class="stepno" id="stepno">שלב 1 מתוך 3</div>
      <h2 id="steptitle" style="font-size:18px"></h2>
      <p id="steptext"></p>
      <div class="sep"></div>
      <div class="note" id="disc"></div>
    </aside>

    <section class="stage">
      <div class="canvasbox">
        <canvas id="cv" width="1200" height="640" aria-label="חתך של מפגש בין שני לוחות"></canvas>
        <div class="chip" id="chip"></div>
        <div class="tools"><button id="age">גיל יחסי</button><button id="lbl" class="on">תוויות</button></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="controls">
        <button class="play" id="play">► הפעלה</button>
        <button class="icon" id="reset" title="חזרה להתחלה">↺</button>
        <div class="track">
          <input type="range" id="t" min="0" max="1000" value="0" aria-label="ציר הזמן">
          <div class="marks" id="marks"></div>
        </div>
        <label style="font-size:13px;color:var(--muted)">קצב
          <select id="speed"><option value="0.5">×0.5</option><option value="1" selected>×1</option><option value="1.5">×1.5</option></select>
        </label>
      </div>
      <div class="steps" id="steps"></div>
    </section>
  </div>
  <footer><span>כוורת · גיאולוגיה · נדב שמגר</span><span>המחשות מושגיות, לא בקנה מידה</span></footer>
</div>

<script>
(()=>{
const W=1200,H=640,SEA=170,SF=240;
const cv=document.getElementById('cv');let ctx=cv.getContext('2d');const mainCtx=ctx;
const gcv=document.createElement('canvas');gcv.width=W;gcv.height=H;const gctx=gcv.getContext('2d');let GLOWONLY=false;
let SIM='convergence',AGE=false,mode='oc',T=0,playing=false,labels=true,speed=1,last=performance.now();
const DUR=26;

/* ---------- utilities ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=v=>{v=clamp(v);return v*v*(3-2*v)};
const lerp=(a,b,u)=>a+(b-a)*u;
const frac=v=>v-Math.floor(v);
function hex(c){c=c.replace('#','');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function toHex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mix(a,b,u){const A=hex(a),B=hex(b);return toHex(A.map((v,i)=>lerp(v,B[i],u)))}
function shade(c,k){return toHex(hex(c).map(v=>v*k))}
function noise(seed){const r=[];let s=seed;for(let i=0;i<1024;i++){s=(s*16807)%2147483647;r.push(s/2147483647)}
  return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return r[i&1023]*(1-u)+r[(i+1)&1023]*u}}
const n1=noise(11),n2=noise(29),n3=noise(53),n4=noise(97);
const fbm=x=>n1(x)*.5+n2(x*2.13)*.3+n3(x*4.7)*.2;
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}}

/* ---------- textures (built once) ---------- */
function makeGrain(){const c=document.createElement('canvas');c.width=c.height=220;const g=c.getContext('2d');const r=rnd(7);
  for(let i=0;i<5200;i++){const a=r()*.5;g.fillStyle=r()<.5?`rgba(0,0,0,${a*.5})`:`rgba(255,255,255,${a*.4})`;g.fillRect(r()*220,r()*220,1+r()*1.6,1+r()*1.6)}
  for(let i=0;i<60;i++){g.fillStyle=`rgba(0,0,0,${r()*.06})`;g.beginPath();g.ellipse(r()*220,r()*220,4+r()*14,2+r()*6,r()*3,0,7);g.fill()}
  return ctx.createPattern(c,'repeat')}
function makeMottle(){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');const r=rnd(3);
  for(let i=0;i<420;i++){const x=r()*W,y=280+r()*380,rad=20+r()*90;const gr=g.createRadialGradient(x,y,0,x,y,rad);
    const dark=r()<.55;gr.addColorStop(0,dark?'rgba(90,20,10,.22)':'rgba(255,170,90,.16)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2)}
  return c}
const GRAIN=makeGrain(),MOTTLE=makeMottle();
function makeMantle(){const w=600,h=200,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const im=g.createImageData(w,h);
  const r=rnd(17),P=[];for(let i=0;i<4096;i++)P.push(r());
  const hsh=(x,y)=>P[((x*73856093)^(y*19349663))&4095];
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return lerp(lerp(hsh(xi,yi),hsh(xi+1,yi),u),lerp(hsh(xi,yi+1),hsh(xi+1,yi+1),u),v)};
  const stops=[[0,[50,14,6]],[.35,[104,32,12]],[.6,[146,54,20]],[.82,[172,74,28]],[1,[192,92,38]]];
  const col=v=>{for(let i=1;i<stops.length;i++)if(v<=stops[i][0]){const a=stops[i-1],b=stops[i],u=(v-a[0])/(b[0]-a[0]);return a[1].map((q,k)=>lerp(q,b[1][k],u))}return stops[4][1]};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0,a=.5,f=.011;for(let o=0;o<5;o++){v+=a*Math.abs(vn(x*f,y*f*1.4)*2-1);a*=.5;f*=2.1}
    v=clamp(1.02-v*1.1);v=Math.pow(v,1.45);const dd=y/h;v*=lerp(1,.75,dd);const c3=col(clamp(v));const i=(y*w+x)*4;im.data[i]=c3[0];im.data[i+1]=c3[1];im.data[i+2]=c3[2];im.data[i+3]=255}
  g.putImageData(im,0,0);return c}
const MANTLE=makeMantle();

function convCells(list,lab){
  ctx.save();ctx.lineWidth=2;ctx.setLineDash([16,18]);
  list.forEach(([cx,cy,rx,ry,dir])=>{ctx.strokeStyle='rgba(255,226,190,.32)';ctx.lineDashOffset=-dir*T*900;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,7);ctx.stroke();
    ctx.setLineDash([]);for(let k=0;k<4;k++){const th=k*Math.PI/2+dir*T*6+.6;const x=cx+rx*Math.cos(th),y=cy+ry*Math.sin(th);const tx=-rx*Math.sin(th)*dir,ty=ry*Math.cos(th)*dir;const L=Math.hypot(tx,ty)||1;const ux=tx/L,uy=ty/L;
      ctx.fillStyle='rgba(255,226,190,.5)';ctx.beginPath();ctx.moveTo(x+ux*9,y+uy*9);ctx.lineTo(x-ux*5-uy*6,y-uy*5+ux*6);ctx.lineTo(x-ux*5+uy*6,y-uy*5-ux*6);ctx.closePath();ctx.fill()}ctx.setLineDash([16,18])});
  ctx.restore();if(labels&&lab)pill('זרמי ערבול',...lab);
}
function rim(pts,col='rgba(255,214,150,.85)',w=2,blur=10){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.restore()}
function polyPath(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}
function fillPoly(pts,fill,grain=.5){polyPath(pts);ctx.fillStyle=fill;ctx.fill();if(grain){ctx.save();ctx.clip();ctx.globalAlpha=grain;ctx.globalCompositeOperation='overlay';ctx.fillStyle=GRAIN;ctx.fillRect(0,0,W,H);ctx.restore()}}

/* ---------- background ---------- */
function sky(clock){
  const g=ctx.createLinearGradient(0,0,0,SEA+10);g.addColorStop(0,'#03060c');g.addColorStop(.6,'#0b1a2b');g.addColorStop(1,'#1d3d58');
  ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,SEA+210);
  const r=rnd(9);for(let i=0;i<90;i++){const x=r()*W,y=r()*SEA*.7,tw=.4+.6*Math.abs(Math.sin(clock*.8+i));ctx.fillStyle=`rgba(220,235,255,${.35*tw*r()})`;ctx.fillRect(x,y,1.3,1.3)}
  const h=ctx.createLinearGradient(0,SEA-40,0,SEA+4);h.addColorStop(0,'rgba(90,160,220,0)');h.addColorStop(1,'rgba(110,180,235,.35)');ctx.fillStyle=h;ctx.fillRect(-200,SEA-40,W+400,44);
}
function cloud(x,y,k){ctx.fillStyle='#ffffff';[[0,0,40,13],[28,-8,30,14],[56,2,36,11],[20,6,46,10]].forEach(([dx,dy,rx,ry])=>{ctx.beginPath();ctx.ellipse(x+dx*k,y+dy*k,rx*k,ry*k,0,0,7);ctx.fill()})}
function waterBody(){
  const g=ctx.createLinearGradient(0,SEA,0,340);g.addColorStop(0,'#1f6f9c');g.addColorStop(.3,'#0f4369');g.addColorStop(1,'#020b17');
  ctx.fillStyle=g;ctx.fillRect(-200,SEA,W+400,200);
  ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<7;i++){const x=80+i*170;const lg=ctx.createLinearGradient(x,SEA,x+60,SEA+150);lg.addColorStop(0,'rgba(120,200,255,.10)');lg.addColorStop(1,'rgba(120,200,255,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(x,SEA);ctx.lineTo(x+26,SEA);ctx.lineTo(x+110,SEA+170);ctx.lineTo(x+70,SEA+170);ctx.closePath();ctx.fill()}ctx.restore();
}
function seaSurface(topFn,clock){
  ctx.save();ctx.lineWidth=2;ctx.strokeStyle='rgba(170,220,255,.9)';ctx.shadowColor='rgba(120,200,255,.9)';ctx.shadowBlur=8;ctx.beginPath();let on=false;
  for(let x=0;x<=W;x+=3){const y=SEA+1.6*Math.sin(x*.045+clock*1.4)+1*Math.sin(x*.11-clock*2);if(topFn(x)>SEA+1){if(!on){ctx.moveTo(x,y);on=true}else ctx.lineTo(x,y)}else on=false}
  ctx.stroke();ctx.restore();
}
function asthenosphere(clock){
  ctx.drawImage(MANTLE,-200,285,W+400,H-285+200);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){const x=120+i*200+40*Math.sin(clock*.12+i*1.7),y=420+60*Math.sin(clock*.09+i);const rg=ctx.createRadialGradient(x,y,0,x,y,150);
    rg.addColorStop(0,'rgba(255,120,40,.13)');rg.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=rg;ctx.fillRect(x-150,y-150,300,300)}
  ctx.restore();
  const d=ctx.createLinearGradient(0,285,0,H+100);d.addColorStop(0,'rgba(0,0,0,0)');d.addColorStop(1,'rgba(10,0,0,.55)');ctx.fillStyle=d;ctx.fillRect(-200,285,W+400,H);
}
function terrainSkin(topFn,x0,x1,opt={}){
  const step=2;
  for(let x=x0;x<x1;x+=step){
    const ya=topFn(x),yb=topFn(x+step);const y=(ya+yb)/2;if(y>SEA-1&&!opt.under)continue;if(opt.reliefAbove&&y<opt.reliefAbove)continue;
    const sl=(yb-ya)/step;const light=clamp(1-sl*.55,.7,1.2);
    let c;const hgt=SEA-y;const nn=fbm(x*.07);
    if(opt.under)c='#55554f';
    else if(y<70+nn*16)c='#f2f5f8';
    else if(y<104+nn*14||Math.abs(sl)>1.3)c=mix('#9a8e80','#b2a696',nn);
    else if(hgt<5)c='#d6c69a';
    else c=mix('#7d9c4c','#a2b365',nn);
    ctx.fillStyle=shade(c,light);
    ctx.beginPath();ctx.moveTo(x,ya-.6);ctx.lineTo(x+step+.4,yb-.6);ctx.lineTo(x+step+.4,yb+8);ctx.lineTo(x,ya+8);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(70,55,35,.18)';ctx.beginPath();ctx.moveTo(x,ya+8);ctx.lineTo(x+step+.4,yb+8);ctx.lineTo(x+step+.4,yb+12);ctx.lineTo(x,ya+12);ctx.closePath();ctx.fill();
  }
}
function relief(topFn,x0,x1,baseY){
  const top=[];for(let x=x0;x<=x1;x+=3)top.push([x,Math.min(topFn(x),baseY)]);
  const pts=[[x0,baseY],...top,[x1,baseY]];
  fillPoly(pts,'#9d9182',.55);
  ctx.save();polyPath(pts);ctx.clip();
  // snow cap
  const snowL=x=>78+22*fbm(x*.012+5);
  ctx.beginPath();let first=true;for(let x=x0;x<=x1;x+=3){const y=Math.min(topFn(x),snowL(x));first?ctx.moveTo(x,y):ctx.lineTo(x,y);first=false}
  for(let x=x1;x>=x0;x-=3)ctx.lineTo(x,snowL(x));ctx.closePath();ctx.fillStyle='#f1f4f7';ctx.fill();
  // rock streaks
  ctx.strokeStyle='rgba(70,60,50,.18)';ctx.lineWidth=1.2;for(let x=x0;x<x1;x+=11){const y=topFn(x);if(y>baseY-8||y<snowL(x)+6)continue;ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x+(topFn(x+6)-topFn(x-6))*.8,Math.min(baseY,y+40+20*n4(x*.1)));ctx.stroke()}
  // lighting (sun from the left)
  const lg=ctx.createLinearGradient(x0,0,x1,0);
  for(let x=x0;x<=x1;x+=24){let sl=0;for(let k=-4;k<=4;k++)sl+=(topFn(x+k*8+10)-topFn(x+k*8-10))/20;sl/=9;
    const L=clamp(-sl*.9,-.6,.6);lg.addColorStop((x-x0)/(x1-x0),L<0?`rgba(255,250,240,${-L*.55})`:`rgba(35,25,15,${L*.75})`)}
  ctx.fillStyle=lg;ctx.fillRect(x0,0,x1-x0,baseY+2);
  // green foothills
  const gg=ctx.createLinearGradient(0,baseY-26,0,baseY);gg.addColorStop(0,'rgba(125,156,76,0)');gg.addColorStop(1,'rgba(125,156,76,.85)');ctx.fillStyle=gg;ctx.fillRect(x0,baseY-26,x1-x0,28);
  ctx.restore();
}
function hazeRidge(x0,x1,baseFn,amp,col){
  ctx.beginPath();ctx.moveTo(x0,SEA+5);
  for(let x=x0;x<=x1;x+=6)ctx.lineTo(x,baseFn(x)-10-amp*Math.pow(fbm(x*.008+3),1.6)*1.6);
  ctx.lineTo(x1,SEA+5);ctx.closePath();ctx.fillStyle=col;ctx.fill();
}

/* ---------- subduction geometry ---------- */
const BEND=390,R=300,TH=0.72,LA=R*TH,LTH=60,CR=14,XF=530,XV=720;
const L0=200,LMAX=660;const Lsub=t=>L0+(LMAX-L0)*t;
function P(s){if(s<=0)return [BEND+s,SF,0];
  if(s<=LA){const a=s/R;return [BEND+R*Math.sin(a),SF+R*(1-Math.cos(a)),a]}
  const bx=BEND+R*Math.sin(TH),by=SF+R*(1-Math.cos(TH));return [bx+(s-LA)*Math.cos(TH),by+(s-LA)*Math.sin(TH),TH]}
const Nrm=a=>[-Math.sin(a),Math.cos(a)];
let slabPts=[];
function buildSlab(t){slabPts=[];const L=Lsub(t);for(let s=-BEND-30;s<=L;s+=5)slabPts.push([s,...P(s)])}
function slabTopAt(x){for(let i=1;i<slabPts.length;i++){const a=slabPts[i-1],b=slabPts[i];if(x>=a[1]&&x<=b[1]){const u=(x-a[1])/(b[1]-a[1]||1);return lerp(a[2],b[2],u)}}return null}

function topO(x){ // overriding plate surface
  if(mode==='oc'){if(x<650){const ts=slabTopAt(XF)??275;return lerp(ts,153,sm((x-XF)/120))}return 152+7*(fbm(x*.01)-.5)}
  const ts=slabTopAt(XF)??275;if(x<600)return lerp(ts,SF,sm((x-XF)/70));return SF+3*(fbm(x*.02)-.5)}
function baseO(x){const lb=mode==='oc'?330:300;const st=slabTopAt(x);return st==null?lb:Math.min(lb,st)}
function crustO(x){const cb=mode==='oc'?262:SF+CR;return Math.max(topO(x),Math.min(cb,baseO(x)))}

function drawSlab(t){
  const L=Lsub(t);
  for(let i=1;i<slabPts.length;i++){
    const [s0,x0,y0,a0]=slabPts[i-1],[s1,x1,y1,a1]=slabPts[i];
    const n0=Nrm(a0),n1=Nrm(a1);const df=clamp((y1-320)/260)*.75;const fade=clamp((L-s1)/45);
    ctx.globalAlpha=fade;
    const q=(d0,d1,col)=>{ctx.beginPath();ctx.moveTo(x0+n0[0]*d0,y0+n0[1]*d0);ctx.lineTo(x1+n1[0]*d0,y1+n1[1]*d0);ctx.lineTo(x1+n1[0]*d1,y1+n1[1]*d1);ctx.lineTo(x0+n0[0]*d1,y0+n0[1]*d1);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=.8;ctx.stroke()};
    q(0,CR,mix('#3c4249','#6a3424',df));
    q(CR,LTH,mix('#7a5a3c','#b0502a',df));
  }
  ctx.globalAlpha=1;
  // grain over slab
  ctx.save();ctx.beginPath();slabPts.forEach(([s,x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  for(let i=slabPts.length-1;i>=0;i--){const [s,x,y,a]=slabPts[i];const n=Nrm(a);ctx.lineTo(x+n[0]*LTH,y+n[1]*LTH)}ctx.closePath();ctx.clip();
  ctx.globalAlpha=.45;ctx.globalCompositeOperation='overlay';ctx.fillStyle=GRAIN;ctx.fillRect(0,0,W,H);ctx.restore();
  rim(slabPts.filter(p=>p[0]<L-30).map(p=>[p[1],p[2]]),'rgba(180,215,240,.8)',1.6,8);
  rim(slabPts.filter(p=>p[0]<L-30).map(([s,x,y,a])=>{const n=Nrm(a);return[x+n[0]*LTH,y+n[1]*LTH]}),'rgba(255,170,80,.75)',2.2,14);
  // moving markers (plate material travelling into the mantle)
  const sMin=-BEND-30,K=Math.ceil((LMAX-sMin)/70)+1,span=70*K;
  for(let j=0;j<K;j++){const s=sMin+frac((j*70+(LMAX-L0)*t)/span)*span;if(s>L-15)continue;
    const [x,y,a]=P(s),n=Nrm(a);ctx.strokeStyle='rgba(205,214,222,.55)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x+n[0]*2,y+n[1]*2);ctx.lineTo(x+n[0]*(CR-2),y+n[1]*(CR-2));ctx.stroke();
    ctx.fillStyle='rgba(235,215,180,.35)';ctx.beginPath();ctx.arc(x+n[0]*38,y+n[1]*38,2.2,0,7);ctx.fill()}
}
function drawOverriding(t){
  const top=[],cr=[],bs=[];for(let x=XF;x<=W+6;x+=4){top.push([x,topO(x)]);cr.push([x,crustO(x)]);bs.push([x,baseO(x)])}
  // mantle part
  fillPoly([...cr,...bs.slice().reverse()],'#7a5a3c',.5);
  // crust
  const crustCol=mode==='oc'?'#a28763':'#2f3842';
  fillPoly([...top,...cr.slice().reverse()],crustCol,.55);
  if(mode==='oc'){ // strata lines
    ctx.save();polyPath([...top,...cr.slice().reverse()]);ctx.clip();ctx.strokeStyle='rgba(80,60,40,.22)';ctx.lineWidth=1;
    for(let k=1;k<5;k++){ctx.beginPath();for(let x=XF;x<=W;x+=6){const y=lerp(topO(x)+16,crustO(x),k/5)+2*Math.sin(x*.03+k);x===XF?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
    ctx.restore();
  }
  rim(bs.filter(([x,y])=>y>=(mode==='oc'?329:299)),'rgba(255,170,80,.7)',2.2,14);
  // plate motion ticks in overriding mantle
  for(let j=0;j<10;j++){const x=W+30-frac((j*80+90*t)/800)*800;if(x<XF+120)continue;const y0=crustO(x)+8,y1=baseO(x)-8;if(y1-y0<10)continue;
    ctx.strokeStyle='rgba(230,210,175,.4)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke()}
}

/* ---------- volcano & magma ---------- */
function volcanoParams(t){const base=mode==='oc'?topO(XV):SF;const Hmax=mode==='oc'?118:132;const bw=mode==='oc'?108:118;
  return {base,bw,Hv:Hmax*sm((t-.6)/.25),chamberY:mode==='oc'?212:262}}
function vProfile(x,v){const dx=Math.abs(x-XV);if(dx>v.bw)return v.base;let y=v.base-v.Hv*Math.pow(1-dx/v.bw,1.45);
  if(dx<10)y+=7*(1-(dx/10)**2)*(v.Hv/92);return y}
function drawMagma(t,clock){
  if(t<.44)return;const v=volcanoParams(t);const g1=sm((t-.44)/.08);
  const srcX=XV-14,srcY=432;
  // melt zone above slab
  let rg=ctx.createRadialGradient(srcX,srcY,0,srcX,srcY,60);rg.addColorStop(0,`rgba(255,190,80,${.85*g1})`);rg.addColorStop(.5,`rgba(255,110,30,${.45*g1})`);rg.addColorStop(1,'rgba(255,80,20,0)');
  ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(srcX,srcY,60,24,-.2,0,7);ctx.fill();
  // conduit growth
  const up1=sm((t-.47)/.2);const topY=lerp(srcY,v.chamberY,up1);
  const up2=sm((t-.66)/.14);const vent=vProfile(XV,v)+4;
  const path=[[srcX,srcY]];for(let y=srcY;y>=topY;y-=6){const u=(srcY-y)/(srcY-v.chamberY);path.push([lerp(srcX,XV,u)+1.6*Math.sin(y*.05),y])}
  if(up2>0){for(let y=v.chamberY;y>=lerp(v.chamberY,vent,up2);y-=4)path.push([XV+.6*Math.sin(y*.2),y])}
  if(GLOWONLY){const vb=v.base-2;for(let i=path.length-1;i>=0;i--)if(path[i][1]<vb)path.splice(i,1)}
  const glow=.85+.15*Math.sin(clock*3);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='rgba(255,120,20,.9)';ctx.shadowBlur=18;
  ctx.strokeStyle=`rgba(255,110,30,${.35*glow})`;ctx.lineWidth=16;ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
  ctx.shadowBlur=8;ctx.strokeStyle='rgba(255,170,70,.95)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='rgba(255,236,170,.8)';ctx.lineWidth=1.6;ctx.stroke();ctx.restore();
  // magma chamber
  const g3=sm((t-.6)/.12);if(g3>0){rg=ctx.createRadialGradient(XV,v.chamberY,0,XV,v.chamberY,40*g3);rg.addColorStop(0,'rgba(255,230,140,.95)');rg.addColorStop(.45,'rgba(255,140,40,.9)');rg.addColorStop(1,'rgba(200,60,20,0)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(XV,v.chamberY,42*g3,15*g3,0,0,7);ctx.fill()}
  // rising blobs (deterministic in t)
  for(let i=0;i<9;i++){const p=frac(t*5.5+i/9);const y=lerp(srcY,v.chamberY+6,p);if(y<topY)continue;const x=lerp(srcX,XV,p)+7*Math.sin(p*9+i);
    const r=5+3*Math.sin(i*2.1+p*4);const b=ctx.createRadialGradient(x-1,y-1,0,x,y,r*1.6);b.addColorStop(0,`rgba(255,235,160,${g1})`);b.addColorStop(.5,`rgba(255,140,40,${.9*g1})`);b.addColorStop(1,'rgba(220,70,20,0)');
    ctx.fillStyle=b;ctx.beginPath();ctx.arc(x,y,r*1.6,0,7);ctx.fill()}
}
function drawVolcano(t,clock,ox=0,scale=1,alpha=1,far=false){
  const v0=volcanoParams(t);if(v0.Hv<1)return;
  const v={...v0,Hv:v0.Hv*scale,bw:v0.bw*(.7+.3*scale)};const X=XV+ox;
  const prof=x=>{const dx=Math.abs(x-X);if(dx>v.bw)return v.base;let y=v.base-v.Hv*Math.pow(1-dx/v.bw,1.45);if(dx<10)y+=7*(1-(dx/10)**2)*(v.Hv/92);return y};
  const pts=[];for(let x=X-v.bw;x<=X+v.bw;x+=3)pts.push([x,prof(x)]);pts.push([X+v.bw,v.base+3],[X-v.bw,v.base+3]);
  if(!GLOWONLY){ctx.save();ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(X-v.bw,0,X+v.bw,0);
  if(far){g.addColorStop(0,'#9aa6ad');g.addColorStop(1,'#7f8b93')}else{g.addColorStop(0,'#8b7f73');g.addColorStop(.48,'#756a60');g.addColorStop(.52,'#5f564e');g.addColorStop(1,'#4b443e')}
  fillPoly(pts,g,far?0:.6);
  if(!far){ctx.save();polyPath(pts);ctx.clip();ctx.lineWidth=1.3;
    for(let k=1;k<7;k++){ctx.strokeStyle=k%2?'rgba(40,30,25,.28)':'rgba(190,170,150,.22)';ctx.beginPath();for(let x=X-v.bw;x<=X+v.bw;x+=3){const y=prof(x)+k*7;x===X-v.bw?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
    // old cooled lava streaks
    const r=rnd(5);for(let k=0;k<6;k++){const side=r()<.5?-1:1;const len=v.bw*(.35+r()*.5);ctx.strokeStyle='rgba(35,30,30,.55)';ctx.lineWidth=2.2;ctx.beginPath();for(let d=8;d<len;d+=3){const x=X+side*(d+r()*0);const y=prof(x)-1;d===8?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
    ctx.restore();
    // green foot blending into land (land only)
    if(mode==='oc'){ctx.save();polyPath(pts);ctx.clip();const fg=ctx.createLinearGradient(0,v.base-22,0,v.base);fg.addColorStop(0,'rgba(111,138,69,0)');fg.addColorStop(1,'rgba(111,138,69,.75)');ctx.fillStyle=fg;ctx.fillRect(X-v.bw,v.base-22,v.bw*2,24);ctx.restore()}
  }
  if(mode==='oo'){ // water over submerged part
    ctx.save();polyPath(pts);ctx.clip();const wg=ctx.createLinearGradient(0,SEA,0,SF);wg.addColorStop(0,'rgba(60,150,200,.45)');wg.addColorStop(1,'rgba(13,53,88,.75)');ctx.fillStyle=wg;ctx.fillRect(X-v.bw-5,SEA,v.bw*2+10,SF-SEA+16);ctx.restore()}
  ctx.restore();rim(pts.slice(0,-2),'rgba(255,220,170,.35)',1.2,6);}
  if(far)return;
  // eruption
  const e=sm((t-.8)/.06);if(e<=0)return;const ventY=prof(X)-2;
  const cg=ctx.createRadialGradient(X,ventY,0,X,ventY,46);cg.addColorStop(0,`rgba(255,220,120,${.9*e})`);cg.addColorStop(1,'rgba(255,120,30,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(X,ventY,46,0,7);ctx.fill();
  // lava flows
  [[1,.95],[-1,.7]].forEach(([side,k])=>{const len=v.bw*k*sm((t-.8)/.16);if(len<4)return;
    ctx.save();ctx.lineCap='round';ctx.shadowColor='rgba(255,110,20,.9)';ctx.shadowBlur=10;
    let px=X+side*6,py=prof(px)-1;for(let d=6;d<len;d+=3){const x=X+side*d+side*1.5*Math.sin(d*.15);const y=prof(X+side*d)-1.5;const u=d/len;
      ctx.strokeStyle=u<.35?'#ffe08a':u<.75?'#ff8a1e':'#c4361a';ctx.lineWidth=lerp(6,3,u);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();px=x;py=y}
    ctx.restore()});
  // ash & gas plume
  if(!GLOWONLY)for(let i=0;i<70;i++){const q=frac(t*3.2+i/70+.13*Math.sin(i));const a=(1-q)*.42*e;if(a<.01)continue;
    const x=X+q*q*190+Math.sin(i*1.7+q*5)*q*34,y=ventY-8-q*210,r=7+q*34;
    const pg=ctx.createRadialGradient(x,y,0,x,y,r);const c=i%4===0?'150,120,100':'85,72,66';pg.addColorStop(0,`rgba(${c},${a})`);pg.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=pg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  // bombs
  ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<90;i++){const q=frac(t*4.5+i/90+.37*Math.sin(i*3.1));const ang=-Math.PI/2+(((i*53)%100)/100-.5)*1.6;const sp=60+((i*29)%40)*2.2;
    const x=X+Math.cos(ang)*sp*q+q*q*30,y=ventY+Math.sin(ang)*sp*q+q*q*140;const a=(1-q)*e;ctx.strokeStyle=`rgba(255,${170+(i%5)*15},70,${a})`;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(ang)*5,y-Math.sin(ang)*5+3);ctx.stroke()}ctx.restore();
  for(let i=0;i<10;i++){const q=frac(t*6+i/10);const dir=(i%2?1:-1)*(.4+.6*((i*37)%10)/10);const x=X+dir*q*70,y=ventY-q*90+q*q*120;ctx.fillStyle=`rgba(255,${150+i*8},60,${(1-q)*e})`;ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fill()}
}

/* ---------- earthquakes ---------- */
const QUAKES=(()=>{const r=rnd(41),a=[];for(let i=0;i<14;i++)a.push({t:.08+r()*.9,u:r(),d:r()});return a})();
function drawQuakes(t,locFn){QUAKES.forEach(q=>{const dt=t-q.t;if(dt<0||dt>.035)return;const p=dt/.035;const [x,y]=locFn(q);if(x==null)return;
  ctx.strokeStyle=`rgba(255,240,170,${1-p})`;ctx.lineWidth=2;for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(x,y,4+p*26+k*9,0,7);ctx.stroke()}
  ctx.fillStyle=`rgba(255,250,210,${1-p})`;ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill()})}

/* ---------- continental collision ---------- */
const XC=600;
function ccH(t){return 128*sm((t-.18)/.82)}
function ccEnv(x){return Math.exp(-(((x-XC)/210)**2))}
function ccTop(x,t){const H=ccH(t);let y=152-H*ccEnv(x)*(.78+.36*fbm(x*.02+1))+3*(fbm(x*.09)-.5);
  const D=70*(1-sm(t/.3));y+=D*Math.exp(-(((x-XC)/48)**2));return y}
function ccCB(x,t){return 262+.95*ccH(t)*Math.exp(-(((x-XC)/220)**2))}
function ccLB(x,t){return ccCB(x,t)+72}
function drawCC(t,clock){
  const top=[],cb=[],lb=[];for(let x=-4;x<=W+6;x+=4){top.push([x,ccTop(x,t)]);cb.push([x,ccCB(x,t)]);lb.push([x,ccLB(x,t)])}
  // haze ridges behind
  hazeRidge(0,W,x=>ccTop(x,t),40,'rgba(150,170,185,.35)');
  fillPoly([...cb,...lb.slice().reverse()],'#7a5a3c',.5);
  // two crusts split at suture
  const suture=y=>{const yt=ccTop(XC,t);const u=clamp((y-yt)/(ccLB(XC,t)-yt));return XC-50*u-25*u*u};
  ctx.save();polyPath([...top,...cb.slice().reverse()]);ctx.clip();
  const lg=ctx.createLinearGradient(0,0,W,0);lg.addColorStop(0,'#b99a72');lg.addColorStop(.49,'#b99a72');lg.addColorStop(.51,'#a69886');lg.addColorStop(1,'#a69886');
  ctx.fillStyle='#b39a77';ctx.fillRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(0,0);for(let y=0;y<=H;y+=8)ctx.lineTo(suture(y),y);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle='#bd9c71';ctx.fill();
  ctx.beginPath();ctx.moveTo(W,0);for(let y=0;y<=H;y+=8)ctx.lineTo(suture(y),y);ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#a8998a';ctx.fill();
  ctx.globalAlpha=.55;ctx.globalCompositeOperation='overlay';ctx.fillStyle=GRAIN;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // folded strata
  const F=sm(t/.7);ctx.lineWidth=1.2;
  for(let k=1;k<7;k++){ctx.strokeStyle=k%2?'rgba(70,50,35,.28)':'rgba(240,225,200,.18)';ctx.beginPath();
    for(let x=0;x<=W;x+=4){const yt=ccTop(x,t)+14,yb=ccCB(x,t);let y=lerp(yt,yb,k/7);y+=11*F*Math.sin((x-XC)/24+k*.8)*Math.exp(-(((x-XC)/160)**2));x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
  ctx.restore();
  // suture line through lithosphere
  ctx.strokeStyle='rgba(40,25,15,.55)';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();
  for(let y=ccTop(XC,t)+6;y<=ccLB(XC,t);y+=6){const x=suture(y);y===ccTop(XC,t)+6?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([]);
  // motion ticks in mantle lithosphere
  for(let j=0;j<9;j++){const xl=-20+frac((j*75+130*t)/675)*675;if(xl<XC-70){ctx.strokeStyle='rgba(230,210,175,.45)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(xl,ccCB(xl,t)+10);ctx.lineTo(xl,ccLB(xl,t)-10);ctx.stroke()}
    const xr=W+20-frac((j*75+130*t)/675)*675;if(xr>XC+70){ctx.beginPath();ctx.moveTo(xr,ccCB(xr,t)+10);ctx.lineTo(xr,ccLB(xr,t)-10);ctx.stroke()}}
  rim(lb,'rgba(255,170,80,.75)',2.4,16);
  relief(x=>ccTop(x,t),0,W,150);
  terrainSkin(x=>ccTop(x,t),0,W,{reliefAbove:146});
}

/* ---------- labels ---------- */

/* ---------- main render ---------- */
function cam(){let [z,cx,cy,jx,jy]=SIMS[SIM].cam();const hx=W/2/z,hy=H/2/z;return[z,clamp(cx,hx,W-hx)+(jx||0),clamp(cy,hy,H-hy)+(jy||0)]}
function camConv(){const z=mode==='cc'?1+.08*sm((T-.4)/.6):1+.1*sm((T-.45)/.5);
  const cx=mode==='cc'?600:lerp(600,XV-30,sm((T-.45)/.5)),cy=mode==='cc'?lerp(320,270,sm((T-.4)/.6)):lerp(320,290,sm((T-.45)/.5));return[z,cx,cy]}
function applyCam(c,base){const [z,cx,cy]=cam();c.setTransform(base[0]*z,0,0,base[1]*z,base[0]*(W/2-cx*z),base[1]*(H/2-cy*z))}
let BASE=[1,1];
function drawConv(clock){
  sky(clock);
  if(mode==='cc'){
    waterBody();asthenosphere(clock);convCells([[300,520,230,90,1],[900,520,230,90,-1]],[300,632]);drawCC(T,clock);

  fillPoly([...ot.map(([x,y])=>[x,y+14]),...ob.slice().reverse()],'#6f4f35',.5);
  fillPoly([...ot,...ot.map(([x,y])=>[x,y+14]).reverse()],'#2f3842',.5);
  // continental wedge
  const wt=[],wb=[];for(let x=560;x<=W+210;x+=4){wt.push([x,ground(x)]);wb.push([x,ifc(x)])}
  fillPoly([...wt,...wb.slice().reverse()],'#a28763',.55);
  ctx.save();polyPath([...wt,...wb.slice().reverse()]);ctx.clip();ctx.strokeStyle='rgba(70,50,30,.25)';ctx.lineWidth=1;for(let k=1;k<6;k++){ctx.beginPath();for(let x=560;x<=W+200;x+=6){const y=lerp(ground(x)+10,ifc(x),k/6);x===560?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}ctx.restore();
  rim(ob,'rgba(255,170,80,.7)',2.2,14);
  ctx.strokeStyle='rgba(30,20,10,.6)';ctx.setLineDash([7,5]);ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(560,ifc(560));ctx.lineTo(W+200,ifc(W+200));ctx.stroke();ctx.setLineDash([]);
  // land skin
  terrainSkin(ground,COAST-4,W+200);
  // water columns
  const wg=ctx.createLinearGradient(0,SEA-60,0,340);wg.addColorStop(0,'#2a86b8');wg.addColorStop(.35,'#14527d');wg.addColorStop(1,'#031426');ctx.fillStyle=wg;
  for(let x=-210;x<W+210;x+=2){const top=surfY(x),bot=ground(x);if(top<bot-.3)ctx.fillRect(x,top,2.6,bot-top+.5)}
  // surface line + foam
  ctx.save();ctx.strokeStyle='rgba(170,220,255,.9)';ctx.shadowColor='rgba(120,200,255,.9)';ctx.shadowBlur=8;ctx.lineWidth=2;ctx.beginPath();let on=false;
  for(let x=-210;x<=W+210;x+=3){const y=surfY(x),b=ground(x);const yy=y+(x<COAST?1.2*Math.sin(x*.05+clock*1.4):0);if(y<b-.5){on?ctx.lineTo(x,yy):ctx.moveTo(x,yy);on=true}else on=false}ctx.stroke();ctx.restore();
  if(T>TQ+.3){const xs=T<TC?xr():COAST+235*sm((T-TC)/.12);for(let i=0;i<40;i++){const x=xs-30+((i*37)%60)+4*Math.sin(clock*3+i);const y=surfY(x)-2-((i*13)%8);const a=(T>TC+.18?0:.75)*clamp((xr()-800)/90);ctx.fillStyle=`rgba(240,250,255,${a})`;ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,7);ctx.fill()}}
  if(T>.4&&T<TC+.02){const a=.5*sm((T-.4)/.05);ctx.save();ctx.strokeStyle=`rgba(220,240,255,${a})`;ctx.setLineDash([6,6]);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(COAST-190,SEA);ctx.lineTo(COAST,SEA);ctx.stroke();ctx.restore()}
  // trees & houses
  for(let i=0;i<14;i++){const x=948+i*16+((i*7)%5);if(HOUSES.some(h=>Math.abs(h-x)<10))continue;const g=ground(x);const delay=(x-COAST)/235*.12;const dmg=x<1110?sm((T-TC-delay-.02)/.05):0;
    ctx.save();ctx.translate(x+dmg*12,g);ctx.rotate(dmg*.9);ctx.fillStyle='#4a3a28';ctx.fillRect(-1,-10,2,10);ctx.fillStyle='#355f33';ctx.beginPath();ctx.arc(0,-13,6,0,7);ctx.fill();ctx.restore()}
  HOUSES.forEach(h=>drawHouse(h,clock));
  // quake
  if(T>=TQ){const dt=T-TQ;if(dt<.05){const p=dt/.05;for(let k=0;k<3;k++){ctx.strokeStyle=`rgba(255,235,170,${1-p})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(...FOC,6+p*70+k*14,0,7);ctx.stroke()}}tsFocus();
    }
  if(labels){pill('ים עמוק',520,250);if(T>=TQ)pill('מוקד',FOC[0]+90,FOC[1]+30,FOC[0]+6,FOC[1]+4);
    if(T>=TQ&&T<TQ+.18)pill('תזוזת הקרקעית',520,370,600,ground(600)+6);
    pill('מים רדודים',800,140,820,192);pill('החוף',COAST+60,112,COAST+6,ground(COAST+6)-4);pill('אסתנוספרה',380,455)}
}
function tsFocus(){const g=ctx.createRadialGradient(...FOC,0,...FOC,18);g.addColorStop(0,'rgba(255,240,180,1)');g.addColorStop(1,'rgba(255,150,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(...FOC,18,0,7);ctx.fill()}
function glowTs(clock){if(T>=TQ){tsFocus();return true}return false}
function camTs(){const u=sm((T-.18)/.42);return[lerp(1.12,1.32,u),lerp(640,880,u),lerp(320,215,u)]}

/* ---------- UI ---------- */
const CHIP={oc:'דוגמה: האנדים',oo:'דוגמה: איי מריאנה',cc:'דוגמה: ההימלאיה'};
const $=id=>document.getElementById(id);
function stepOf(t){const st=SIMS[SIM].steps;let k=0;st.forEach((s,i)=>{if(t>=s[0]-1e-6)k=i});return k}
function syncUI(){
  const S=SIMS[SIM];$('t').value=Math.round(T*1000);const k=stepOf(T);
  $('stepno').textContent=`שלב ${k+1} מתוך ${S.steps.length}`;$('steptitle').textContent=S.steps[k][1];$('steptext').textContent=S.steps[k][2];
  document.querySelectorAll('#steps button').forEach((b,i)=>b.classList.toggle('on',i===k));
  const chip=$('chip');chip.textContent=S.modes?CHIP[mode]:'';chip.classList.toggle('show',!!S.modes&&T>.9);
  $('play').textContent=playing?'❚❚ עצירה':(T>=1?'↻ ניגון חוזר':'► הפעלה');
}
function buildSim(){
  const S=SIMS[SIM];document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.sim===SIM));
  $('kicker').textContent=`${S.n} / חוקרים תנועה`;$('h1').textContent=S.title;$('sub').textContent=S.sub;$('preq').textContent=S.q;$('pret').textContent=S.qt;$('disc').textContent=S.disc;
  $('legend').innerHTML=S.legend;$('modes').classList.toggle('hidden',!S.modes);$('age').classList.toggle('hidden',!S.age);$('agebar').style.display=S.age&&AGE?'block':'none';
  $('steps').style.setProperty('--n',S.steps.length);$('steps').innerHTML=S.steps.map((s,i)=>`<button data-i="${i}">${i+1} · ${s[1]}</button>`).join('');
  document.querySelectorAll('#steps button').forEach(b=>b.onclick=()=>{T=Math.min(1,S.steps[+b.dataset.i][0]+.005);playing=false;syncUI()});
  $('marks').innerHTML=S.steps.map((s,i)=>`<span title="${s[1]}" style="right:${s[0]*100}%">${i+1}</span>`).join('');
  document.title=`${S.title} | המנוע שמתחת לרגלינו`;syncUI();
}
function go(id){if(!SIMS[id])id='divergence';SIM=id;T=0;playing=false;buildSim();try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}catch(e){}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.sim));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==SIM&&SIMS[h])go(h)});
$('play').onclick=()=>{if(T>=1)T=0;playing=!playing;last=performance.now();syncUI()};
$('reset').onclick=()=>{T=0;playing=false;syncUI()};
$('t').oninput=e=>{T=e.target.value/1000;playing=false;syncUI()};
$('speed').onchange=e=>speed=+e.target.value;
$('lbl').onclick=e=>{labels=!labels;e.target.classList.toggle('on',labels)};
$('age').onclick=e=>{AGE=!AGE;e.target.classList.toggle('on',AGE);$('agebar').style.display=AGE?'block':'none'};
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));mode=b.dataset.m;T=0;playing=false;syncUI()});

function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*H/W*d);BASE=[cv.width/W,cv.height/H]}
window.addEventListener('resize',fit);
let FT=[],LOWQ=false;
function loop(now){const dt=(now-last)/1000;last=now;if(!LOWQ&&FT.length<90){FT.push(dt);if(FT.length===90){FT.sort((a,b)=>a-b);if(FT[45]>.028)LOWQ=true}}if(playing){T=Math.min(1,T+dt*speed/SIMS[SIM].dur);if(T>=1)playing=false;syncUI()}render(now/1000);requestAnimationFrame(loop)}
fit();go(location.hash.slice(1)||'divergence');requestAnimationFrame(loop);
window.__setT=(sim,m,t,age)=>{if(sim&&sim!==SIM)go(sim);if(m){mode=m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x.dataset.m===m))}AGE=!!age;T=t;syncUI()};
})();
